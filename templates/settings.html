{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <h1>Settings</h1>
    <p>Configure SSE server connection</p>
</div>

<div class="settings-grid">
    <div class="settings-card glass">
        <div class="section-title">SSE Server Configuration</div>
        <div class="form-group">
            <label for="sse-url">Server SSE URL</label>
            <div class="input-with-button">
                <input type="text" id="sse-url" value="{{ sse_url }}" placeholder="https://example.com/sse">
                <button id="connect-btn" class="btn-primary">
                    <i data-lucide="save"></i>
                    <span>Save</span>
                </button>
            </div>
            <span class="field-help">Endpoint to establish SSE connection and fetch MCP tools.</span>
        </div>
        <div id="connection-status" class="status-indicator">
            <span class="dot"></span>
            <span class="status-text">Disconnected</span>
        </div>
    </div>

<script src="{{ url_for('static', filename='js/settings-handler.js') }}"></script>
{% endblock %}
